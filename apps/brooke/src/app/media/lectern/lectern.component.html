@let bookCbtResource = app.bookCbt;
@if (bookCbtResource.hasValue()) {
@let bookCbt = bookCbtResource.value();

@if (bookCbt.length > leftPageNo()) {
<virtual-page [page]="bookCbt[leftPageNo()]" [preferMarkdown]="['COMPARE', 'MARKDOWN'].includes(app.bookViewMode())" />
}
@if (showRightPage()) {
<virtual-page [page]="app.bookViewMode() === 'COMPARE' ? bookCbt[leftPageNo()] : bookCbt[rightPageNo()]"
  [preferMarkdown]="app.bookViewMode() === 'MARKDOWN' && app.bookViewMode() !== 'COMPARE'" />
}
}
